services:
  - type: web
    name: trinetra-backend
    runtime: node
    plan: free
    # Deploy every push to the tracked branch. Without this a push lands in
    # GitHub and the running instance keeps serving the old commit — which is
    # exactly how /fundamentals and /universe 404'd on a deployed build whose
    # source had them.
    autoDeploy: true
    branch: master
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PROVIDER
        value: yahooDelayed
      - key: REFRESH_MS
        value: "60000"
      # Everything below is managed in the Render dashboard. `sync: false` means
      # "this blueprint declares the key but never supplies the value" — a
      # blueprint apply leaves whatever is set there alone. A literal value: ""
      # would blank the dashboard value on every apply, silently disarming the
      # pinger or the alerts it wiped.

      # This service's own deployed URL, e.g.
      # https://trinetra-backend-tukc.onrender.com — keeps the instance awake
      # through market hours. Unset disables the pinger (sleeps on idle).
      - key: SELF_URL
        sync: false

      # Kronos forecast microservice, e.g. https://trinetra-oracle.onrender.com
      # Unset leaves the AI Forecast criterion reading "no data".
      - key: ORACLE_URL
        sync: false

      # Telegram alerts. Set BOTH to arm alerts durably — they survive a
      # redeploy, unlike credentials pushed from the dashboard's Alerts panel.
      # Unset leaves alerts awaiting config, exactly as before.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

      # Accounts. Unset is single-user mode: every request is the owner. Set it
      # and the schema builds on boot, the first signup becomes the owner, and
      # the owner's on-disk data is imported into that account once. Supabase
      # must be the SESSION POOLER string (port 5432) — the direct host is
      # IPv6-only and Render cannot reach it. With this set, UI_ORIGIN must name
      # a real origin: "*" refuses to boot, because browsers discard sign-in
      # cookies against a wildcard and the login would fail silently.
      - key: DATABASE_URL
        sync: false

      # Browser origin allowlist, comma-separated. Vercel previews of the same
      # project and extra localhost ports are derived from it — see the README.
      - key: UI_ORIGIN
        sync: false

      # Pravesh workflow trigger. GitHub's own scheduler never fired a single
      # run, so the backend dispatches instead. Inert unless ENABLED is "true".
      # GITHUB_TOKEN must be a FINE-GRAINED PAT scoped to the pravesh-engine repo
      # only, with Actions: read and write. Nothing else. A classic broad token
      # here would hand this service write access to every repo you own.
      - key: PRAVESH_TRIGGER_ENABLED
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: PRAVESH_REPO
        sync: false
      - key: PRAVESH_WORKFLOW
        sync: false
      - key: PRAVESH_TRIGGER_SLOTS
        sync: false
